name: multistep ASCII Artwork

on:
    [push]

jobs:
    # build the system
    build:
        name: build the system
        runs-on: ubuntu-latest        
        steps:
            - name: "install cowsay"
              run: |
                sudo apt-get install cowsay -y
                cowsay -f dragon "Run for cover, I am a Dragon...Rawr" >> dragon.txt  
            - name: "Upload Dragon text file"
              uses: actions/upload-artifact@v7
              with:
                name: dragon.txt
                path: dragon.txt
    # validate the file availability
    validate:
        name: validate the file
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: "Download Dragon text file"
              uses: actions/download-artifact@v8
              with:
                name: dragon.txt 

            - name: "validate the file"
              run: |                 
               grep -i 'dragon' dragon.txt
    # read the file
    deploy:
        name: run the dragon.txt file
        needs: validate
        runs-on: ubuntu-latest
        steps:
            - name: "Download Dragon text file"
              uses: actions/download-artifact@v8
              with:
                name: dragon.txt 
                
            - name: "Read file"
              run: cat dragon.txt 