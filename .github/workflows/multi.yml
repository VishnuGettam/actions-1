name: multistep ASCII Artwork

on:
    [push]

jobs:
    # build the system
    build:
        name: build the system
        runs-on: ubuntu-latest
        steps:
            - name: "install cowsay"
              run: |
                sudo apt-get install cowsay -y
                cowsay -f dragon "Run for cover, I am a Dragon...Rawr" >> dragon.txt  
    # validate the file availability
    validate:
        name: validate the file
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: "validate the file"
              run: |
               pwd  
               grep -i 'dragon' dragon.txt
    # read the file
    deploy:
        name: run the dragon.txt file
        needs: validate
        runs-on: ubuntu-latest
        steps:
            - name: "Read file"
              run: cat dragon.txt 