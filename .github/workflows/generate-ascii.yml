name: Generate ASCII Artwork

on:
    push

jobs:
    ascii_job:
        name: ASCII Artwork
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repo
          uses: actions/checkout@v6
        
        - name: List the files in repo
          run: ls -ltra

        - name: execute ascii-script.sh
          run: ./ascii-scripts.sh

               